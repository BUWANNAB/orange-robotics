controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom_topic
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    publish_zero_velocity: true
    speed_limit_topic: /speed_limit
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.10
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 0.60
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.12
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.50
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.45
      rotate_to_heading_min_angle: 0.70
      max_angular_accel: 0.60
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
    local_costmap:
      local_costmap:
        ros__parameters:
          use_sim_time: false
          update_frequency: 10.0
          publish_frequency: 5.0
          global_frame: map
          robot_base_frame: base_link
          transform_tolerance: 0.30
          rolling_window: true
          width: 8.0
          height: 8.0
          resolution: 0.10
          footprint: "[]"
          footprint_padding: 0.0
          plugins: [obstacle_layer, inflation_layer]
          obstacle_layer:
            plugin: nav2_costmap_2d::ObstacleLayer
            enabled: true
            footprint_clearing_enabled: true
            observation_sources: lidar
            lidar:
              topic: /cloud/obstacles_filtered
              data_type: PointCloud2
              marking: true
              clearing: true
              max_obstacle_height: 1.8
              obstacle_min_range: 0.15
              obstacle_max_range: 6.0
              raytrace_min_range: 0.0
              raytrace_max_range: 7.0
              observation_persistence: 0.0
              expected_update_rate: 0.5
          inflation_layer:
            plugin: nav2_costmap_2d::InflationLayer
            cost_scaling_factor: 3.0
            inflation_radius: 0.35
          always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin]
    spin:
      plugin: nav2_behaviors/Spin
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.15
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.45
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.60

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: false
    # Odometry rate/latency has not been measured on the target vehicle yet.
    # Open loop avoids feeding stale low-rate feedback into a 50 Hz smoother.
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 0.45]
    min_velocity: [-0.5, 0.0, -0.45]
    max_accel: [0.25, 0.0, 0.60]
    max_decel: [-0.40, 0.0, -0.60]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50
