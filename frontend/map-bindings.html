<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图绑定 · Orange AGV</title><link rel="stylesheet" href="src/modules/maps/workbench.css"><style>main{max-width:1000px;margin:auto}.binding-form{display:grid;gap:18px;padding:28px;background:white;border:1px solid #dde4eb;border-radius:12px}.binding-form label{display:grid;gap:8px}.binding-form .check{display:flex;align-items:flex-start}.binding-form input[type=checkbox]{width:auto}#binding-status,#binding-detail{white-space:pre-line}select{width:100%}.binding-actions{display:flex;gap:12px;flex-wrap:wrap}</style></head>
<body><header class="masthead"><div><span class="eyebrow">ORANGE AGV / 地图管理</span><h1>地图绑定</h1></div><a href="map-workbench.html">返回地图工作台</a></header><main>
<p>把“车辆用来定位的点云”和“任务用来行驶的线路地图”对应起来。保存后，在定位页面重新定位，成功后才会用于新的任务。</p>
<div id="notice" role="status">正在读取绑定…</div>
<form id="binding-form" class="binding-form">
<label>1. 选择定位点云（PCD）<select id="binding-pcd" required><option value="">加载中…</option></select></label>
<p id="binding-status">—</p>
<label>2. 选择线路地图及发布版本<select id="binding-map" required><option value="">请选择</option></select></label>
<p id="binding-detail">只能选择已发布地图。修改草稿后请先校验、发布，再回来更新绑定。</p>
<div class="binding-actions"><a href="operations.html#maps" target="_blank" rel="noopener">查看 / 编辑线路地图 ↗</a><a id="binding-locate" href="localization.html">查看定位地图 ↗</a></div>
<label class="check"><input id="binding-confirm" type="checkbox" required><span>3. 我已核对：两张地图是同一现场，坐标原点和方向一致，单位都是米。仅名称相同不能保证对齐。</span></label>
<p>绑定不会移动、旋转或缩放地图。若两张地图坐标不同，请先修正地图，不能直接绑定后下发任务。</p>
<div class="binding-actions"><button id="binding-save" class="primary">保存绑定</button><button id="binding-remove" type="button">解除绑定</button><button id="binding-refresh" type="button">刷新</button></div>
</form></main><script src="src/libs/axios.min.js"></script><script src="src/api/api-simple.js"></script><script src="src/api/operations.js"></script><script src="src/modules/maps/bindings.js"></script></body></html>
