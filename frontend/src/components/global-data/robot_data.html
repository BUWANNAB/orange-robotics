<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车参数表</title>
    <link href="../../libs/bootstrap/css5.0/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="../../libs/jquery-3.1.0.min.js"></script>
    <style>
        ::placeholder {
            font-size: 0.875rem;
            /* 14px */
        }

        .error-message,
        .webRemoteDataError {
            color: red;
            font-size: 0.875rem;
        }

        .lidarExtrin {
            width: 50%;
        }


        .saveData {
            width: 300px;
            margin-left: calc(50% - 150px);
        }


        .noSeaSys {}


        .toggle-switch {
            display: flex;
            align-items: center;
        }

        /* 开关基础样式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        /* 隐藏原生 checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* 滑块样式 */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 30px;
        }

        /* 滑块圆点 */
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        /* 选中状态（开启） */
        input:checked+.slider {
            background-color: #2196F3;
        }

        input:checked+.slider:before {
            transform: translateX(30px);
        }

        /* 圆形滑块 */
        .slider.round {
            border-radius: 30px;
        }
        
        /* 参数信息按钮样式 */
        .param-info-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #6c757d;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            margin-left: 8px;
            transition: background-color 0.2s;
        }
        
        .param-info-btn:hover {
            background-color: #5a6268;
        }
        
        /* 参数标签容器 */
        .param-label-container {
            display: flex;
            align-items: center;
        }
    </style>
</head>

    <script type="module">
        import RosManager from "../../rosManage/RosManager.js";
        import axiosClient from "../../api/ApiManager.js";
        const rosManager = new RosManager();
        // 避障状态常量对象
        const AVOID_STATUS = {
            ON: '1',
            OFF: '0'
        };

        // 避障开关初始化
        function initAvoidanceSwitch() {
            const avoidtrackSwitch = document.getElementById('avoidtrackSwitch');
            const avoidtrack = document.getElementById('avoidtrack');
            const avoidSwitchStatus = document.getElementById('avoidSwitchStatus');

            if (!avoidtrackSwitch || !avoidtrack || !avoidSwitchStatus) {
                console.warn('避障开关相关元素未找到');
                return;
            }

            // avoidtrack.value === AVOID_STATUS.ON 表示避障功能已开启
            avoidtrackSwitch.checked = avoidtrack.value === AVOID_STATUS.ON;
            updateAvoidSwitchStatus();

            // 避障开关事件监听
            avoidtrackSwitch.addEventListener('change', function () {
                if (this.checked) {
                    avoidtrack.value = AVOID_STATUS.ON;
                } else {
                    avoidtrack.value = AVOID_STATUS.OFF;
                }
                updateAvoidSwitchStatus();
            });
        }

        // 更新避障开关状态显示
        function updateAvoidSwitchStatus() {
            const avoidtrackSwitch = document.getElementById('avoidtrackSwitch');
            const avoidtrack = document.getElementById('avoidtrack');
            const avoidSwitchStatus = document.getElementById('avoidSwitchStatus');

            if (!avoidtrackSwitch || !avoidtrack || !avoidSwitchStatus) {
                console.warn('避障开关相关元素未找到');
                return;
            }
            // avoidtrack.value === AVOID_STATUS.ON 表示避障功能处于开启状态
            if (avoidtrack.value === AVOID_STATUS.ON) {
                avoidSwitchStatus.textContent = '避障开启';
                avoidSwitchStatus.className = 'ms-2 text-success';

                let aviodMsg = new ROSLIB.Message({
                    data: 1,
                });
                rosManager.avoidanceSwitch.publish(aviodMsg);
            } else {
                // avoidtrack.value !== AVOID_STATUS.ON 表示避障功能处于关闭状态
                avoidSwitchStatus.textContent = '避障关闭';
                avoidSwitchStatus.className = 'ms-2 text-muted';
                let aviodMsg = new ROSLIB.Message({
                    data: 0,
                });
                rosManager.avoidanceSwitch.publish(aviodMsg);
            }
        }
        // 页面加载完成后初始化避障开关
        document.addEventListener('DOMContentLoaded', function () {
            initAvoidanceSwitch();
        });
    </script>
</body>

</html>
