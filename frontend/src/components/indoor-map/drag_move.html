                                station.positionY = updatedWorldY;
                                
                                cocoMessage.success("修改成功")
                            }else{
                                cocoMessage.error("修改失败: " + (response.data?.message || "未知错误"))
                            }
                            marker.closePopup();
                        });
                    }

                    // 取消按钮点击事件
                    if (cancelBtn) {
                        cancelBtn.addEventListener('click', function () {
                            isDraggingEnabled = false;
                            marker.dragging.disable();
                            modifyBtn.style.display = 'inline-block';
                            saveBtn.style.display = 'none';
                            cancelBtn.style.display = 'none';
                            
                            // 隐藏移动信息区域
                            const movementInfo = document.getElementById(`movementInfo-${index}`);
                            if (movementInfo) {
                                movementInfo.style.display = 'none';
                            }
                            
                            // 恢复原始坐标
                            marker.setLatLng([marker.originalCoords.y, marker.originalCoords.x]);
                            if (xInput && yInput) {
                                xInput.value = marker.originalWorldCoords.x.toFixed(3);
                                yInput.value = marker.originalWorldCoords.y.toFixed(3);
                            }
                            
                            // 重置移动信息
                            const deltaXEl = document.getElementById(`deltaX-${index}`);
                            const deltaYEl = document.getElementById(`deltaY-${index}`);
                            const distanceEl = document.getElementById(`moveDistance-${index}`);
                            if (deltaXEl && deltaYEl && distanceEl) {
                                deltaXEl.textContent = '0.000';
                                deltaYEl.textContent = '0.000';
                                distanceEl.textContent = '0.000';
                            }
                            
                            // 移除原始位置标记和虚线连接
                            if (marker.originalPositionMarker) {
                                map.removeLayer(marker.originalPositionMarker);
                                marker.originalPositionMarker = null;
                            }
                            if (marker.dragConnectionLine) {
                                map.removeLayer(marker.dragConnectionLine);
                                marker.dragConnectionLine = null;
                            }
                            
                            cocoMessage.info('已取消修改', 2000);
                            
                            // 关闭弹出框
                            marker.closePopup();
                        });
                    }

                    // 添加为路线点按钮点击事件
                    if (addRoutePointBtn) {
                        addRoutePointBtn.addEventListener('click', function () {
                            // 关闭弹出框
                            marker.closePopup();

                            // 如果当前不在路线编辑模式，则启动路线创建模式
                            if (!window.isRouteEditMode && !window.isRouteMode) {
                                startRouteCreation();
                            }

                            // 将站点坐标转换为像素坐标并添加为路线点
                            // 注意：Leaflet使用[纬度, 经度]格式，即[y, x]
                            addRoutePoint(pixelCoords.x, pixelCoords.y);

                            // 显示成功消息
                            cocoMessage.success(`已将站点 "${station.stationName || '未命名站点'}" 添加为路线点`, 2000);
                        });
                    }

                    // 输入框值改变事件
                    if (xInput && yInput) {
                        xInput.addEventListener('change', function () {
                            const newX = parseFloat(this.value);
                            const newY = parseFloat(yInput.value);
                            if (!isNaN(newX) && !isNaN(newY)) {
                                // 世界坐标转像素坐标
                                const newPixelCoords = worldToPixelMath(newX, newY);
                                marker.setLatLng([newPixelCoords.y, newPixelCoords.x]);
                            }
                        });

                        yInput.addEventListener('change', function () {
                            const newX = parseFloat(xInput.value);
                            const newY = parseFloat(this.value);
                            if (!isNaN(newX) && !isNaN(newY)) {
                                // 世界坐标转像素坐标
                                const newPixelCoords = worldToPixelMath(newX, newY);
                                marker.setLatLng([newPixelCoords.y, newPixelCoords.x]);
                            }
                        });
                    }
                });

                // 拖动事件处理
                marker.on('dragstart', function() {
                    // 开始拖动时确保弹出框保持打开
                    if (marker._popup) {
                        marker.openPopup();
                    }
                    
                    // 先移除已存在的原始位置标记和虚线连接（如果有）
                    if (marker.originalPositionMarker) {
                        map.removeLayer(marker.originalPositionMarker);
                        marker.originalPositionMarker = null;
                    }
                    if (marker.dragConnectionLine) {
                        map.removeLayer(marker.dragConnectionLine);
                        marker.dragConnectionLine = null;
                    }
                    
                    // 在原始位置创建虚线标记
                    const originalPixelCoords = marker.originalCoords;
                    const originalLatLng = L.latLng(originalPixelCoords.y, originalPixelCoords.x);
                    
                    // 创建原始位置的虚线标记
                    const originalMarkerIcon = L.divIcon({
                        className: 'original-position-marker',
                        html: `<div style="background: transparent; width: 16px; height: 16px; border: 2px dashed #f44336; border-radius: 50%; box-shadow: 0 0 4px rgba(255,0,0,0.5); display: flex; align-items: center; justify-content: center;"></div>`,
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });
                    
                    marker.originalPositionMarker = L.marker(originalLatLng, { 
                        icon: originalMarkerIcon,
                        zIndexOffset: -1500
                    }).addTo(map);
                    
                    // 创建连接原始位置和当前位置的虚线
                    const currentLatLng = marker.getLatLng();
                    marker.dragConnectionLine = L.polyline(
                        [originalLatLng, currentLatLng],
                        {
                            color: '#f44336',
                            weight: 2,
                            opacity: 0.7,
                            dashArray: '5, 10',
                            zIndexOffset: 400
                        }
                    ).addTo(map);
                });
                
                marker.on('drag', function() {
                    // 拖动过程中实时更新坐标
                    updatePopupCoords();
                    
                    // 更新虚线连接
                    if (marker.dragConnectionLine) {
                        const originalLatLng = marker.originalPositionMarker.getLatLng();
                        const currentLatLng = marker.getLatLng();
                        marker.dragConnectionLine.setLatLngs([originalLatLng, currentLatLng]);
                    }
                });
                
                marker.on('dragend', function() {
                    // 拖动结束后再次更新坐标，确保准确
                    updatePopupCoords();
                });

                // 将标记添加到全局数组中
                window.stationMarkers.push(marker);
            });

            console.log(`成功渲染了 ${window.stationMarkers.length} 个站点到地图上`);

        // 显示添加站点模态框
        async function showAddStationModal() {
            const modal = document.getElementById('addStationModal');
            modal.classList.remove('hidden');
            // 清空输入框
            document.getElementById('stationNameInput').value = '';
            document.getElementById('stationXInput').value = '';
            document.getElementById('stationYInput').value = '';
            let stationName = document.getElementById('stationNameInput').value.trim();
            const currentRobotPoseStr = localStorage.getItem('positionData');
            if (currentRobotPoseStr) {
                try {
                    const currentRobotPose = JSON.parse(currentRobotPoseStr);
                    if (currentRobotPose && currentRobotPose.localX !== null && currentRobotPose.localY !== null) {
                        document.getElementById('stationXInput').value = currentRobotPose.localX.toFixed(3);
                        document.getElementById('stationYInput').value = currentRobotPose.localY.toFixed(3);
                    }
                } catch (error) {
                    console.error('解析机器人位置数据失败:', error);
                }
            }

            // 绑定取消按钮事件
            const cancelBtn = document.getElementById('addStationCancel');
            cancelBtn.onclick = function () {
                modal.classList.add('hidden');
            };
            // 绑定确认按钮事件
            const confirmBtn = document.getElementById('addStationConfirm');
            confirmBtn.onclick = async function () {
                const stationName = document.getElementById('stationNameInput').value.trim();
                const stationX = parseFloat(document.getElementById('stationXInput').value);
                const stationY = parseFloat(document.getElementById('stationYInput').value);

                // 先验证输入
                if (!stationName) {
                    cocoMessage.error('请输入站点名称', 2000);
                    return;
                }
                if (isNaN(stationX) || isNaN(stationY)) {
                    cocoMessage.error('请输入有效的坐标值', 2000);
                    return;
                }

                const mapSelect = document.getElementById('mapSelect');
                const currentMapName = mapSelect ? mapSelect.value : null;

                // 从 positionData 中获取位置和方向数据
                const positionDataStr = localStorage.getItem("positionData");
                let positionData = {};
                if (positionDataStr) {
                    try {
                        positionData = JSON.parse(positionDataStr);
                    } catch (e) {
                        console.error('解析 positionData 失败:', e);
                    }
                }

                let allparams = {
                    latitude: positionData.latitudeCurrent || localStorage.getItem("latitudeCurrent") || 0,
                    longitude: positionData.longitudeCurrent || localStorage.getItem("longitudeCurrent") || 0,
                    positionX: document.getElementById('stationXInput').value,
                    positionY: document.getElementById('stationYInput').value,
                    positionZ: 0,
                    orientationX: positionData.orientationX  || 0,
                    orientationY: positionData.orientationY  || 0,
                    orientationZ: positionData.orientationZ  || 0,
                    orientationW: positionData.orientationW  || 0,
                    stationName: document.getElementById('stationNameInput').value,
                    stationCode: 2,
                    mapName: currentMapName
                };
                const response = await axiosClient.post('station/add', allparams);
                
                if (response.data.data) {
                    cocoMessage.success('站点添加成功', 2000);
                    // 关闭模态框
                    modal.classList.add('hidden');
                    // 重新渲染所有站点，确保新增站点具有完整功能（修改、拖动等）
                    await renderAllStation();
                } else {
                    // 站点添加失败
                    cocoMessage.error('站点添加失败', 2000);
                }
            };
        }

        // 添加站点到地图
        function addStationToMap(stationName, worldX, worldY) {
            // 将世界坐标转换为像素坐标
            const pixelCoords = worldToPixelMath(worldX, worldY);

            // 创建站点图标
            const stationIcon = L.divIcon({
                className: 'station-marker',
                html: `<div style="background: #36e201; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: bold;" title="${stationName}"></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            // 创建站点标记
            const marker = L.marker([pixelCoords.y, pixelCoords.x], { icon: stationIcon }).addTo(map);

            // 添加弹出框显示站点信息
            const popupContent = `
                <div style="min-width: 200px;">
                    
                   ${stationName} <span style="margin: 5px 0; font-size: 12px;"><strong>站点坐标:</strong> (${worldX.toFixed(3)}, ${worldY.toFixed(3)})</span>
                    <button id="addRoutePointBtn-${Date.now()}" style="margin-top: 10px; padding: 5px 10px; background-color: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px;">添加为路线点</button>
                </div>
            `;
            marker.bindPopup(popupContent);

            // 为弹出框中的按钮添加点击事件
            marker.on('popupopen', function () {
                const addRoutePointBtn = document.getElementById(`addRoutePointBtn-${Date.now()}`);
                if (addRoutePointBtn) {
                    addRoutePointBtn.addEventListener('click', function () {
                        // 关闭弹出框
                        marker.closePopup();

                        // 如果当前不在路线编辑模式，则启动路线创建模式
                        if (!window.isRouteEditMode && !window.isRouteMode) {
                            startRouteCreation();
                        }

                        // 将站点坐标转换为像素坐标并添加为路线点
                        addRoutePoint(pixelCoords.x, pixelCoords.y);
                        
                        // 显示成功消息
                        cocoMessage.success(`已将站点 "${stationName}" 添加为路线点`, 2000);
                    });
                }
            });

            // 将标记添加到全局数组中
            if (!window.stationMarkers) {
                window.stationMarkers = [];
            }
            window.stationMarkers.push(marker);

            console.log(`成功添加站点 "${stationName}" 到地图上，坐标: (${worldX}, ${worldY})`);
        }

        function routeMsgSet() {

            const routeSelect = document.getElementById('routeSelect');
            const globalSettingsContainer = document.getElementById('global-settings-container');
            const currentRouteSettingsContainer = document.getElementById('current-route-settings-container');
            const modalTitle = document.getElementById('globalSettingsModalLabel');

            if (routeSelect && routeSelect.value) {
                // 有选择的路线，显示当前路线设置，隐藏全局设置
                currentRouteSettingsContainer.style.display = 'block';
                globalSettingsContainer.style.display = 'none';
                modalTitle.textContent = '当前路线设置';

                // 获取当前路线信息
                const selectedRouteId = routeSelect.value;

                // 显示当前路线名称（使用select的选中选项的文本，切割掉冒号及冒号之前的内容）
                const selectedOption = routeSelect.options[routeSelect.selectedIndex];
                let routeName = selectedOption ? selectedOption.text : selectedRouteId;
                // 切割掉冒号及冒号之前的内容
                if (routeName.includes(':')) {
                    routeName = routeName.split(':')[1].trim();
                }
                document.getElementById('currentRouteName').value = routeName;

                // 显示当前路线速度（使用routeSpeed元素的textContent值）
                const routeSpeedElement = document.getElementById('routeSpeed');

                const speedValue = routeSpeedElement ? parseFloat(routeSpeedElement.textContent) : '';
                document.getElementById('currentRouteSpeed').value = speedValue || '0.2'; // 如果没有速度值则使用默认值
                
                // 显示当前路线变道模式（使用station-avoid元素的值）
                const stationAvoidElement = document.getElementById('station-avoid');
                const avoidValue = stationAvoidElement ? stationAvoidElement.value : '0';
                document.getElementById('currentRouteAvoid').value = avoidValue;
                
            } else {
                // 没有选择的路线，显示全局设置，隐藏当前路线设置

                globalSettingsContainer.style.display = 'block';
                modalTitle.textContent = '全局设置';

            // 显示模态框
            const modal = new bootstrap.Modal(document.getElementById('globalSettingsModal'));

        const controlTypes = {
            START: 0,
            STOP: 1,
            CANCEL: 2
        };
        const operationNames = {
            0: "启动",
            1: "停止",
            2: "取消"
        };

        const taskActionLocks = new Set();
        const taskButtonLabels = {
            publishTaskBtn: '发布任务',
            startTaskBtn: '执行任务',
            stopTaskBtn: '停止任务',
            cancelTaskBtn: '取消任务'
        };
        let taskRoutePublished = false;

        function getTaskRouteSelection() {
            const routeSelect = document.getElementById('routeSelect');
            const selectedOption = routeSelect && routeSelect.selectedIndex >= 0
                ? routeSelect.options[routeSelect.selectedIndex]
                : null;
            return {
                id: routeSelect ? routeSelect.value : '',
                name: routeSelect && routeSelect.value && selectedOption
                    ? selectedOption.textContent.trim()
                    : ''
            };
        }

        function setTaskUiState(message, state, hint) {
            const badge = document.getElementById('taskStateBadge');
            const hintElement = document.getElementById('taskActionHint');
            if (badge) {
                badge.textContent = message;
                badge.dataset.state = state;
            }
            if (hintElement && hint) {
                hintElement.textContent = hint;
            }
        }

        function syncTaskControls() {
            const selection = getTaskRouteSelection();
            const selectedRoute = document.getElementById('taskSelectedRoute');
            const routeSelect = document.getElementById('routeSelect');
            const publishButton = document.getElementById('publishTaskBtn');
            const startButton = document.getElementById('startTaskBtn');
            const stopButton = document.getElementById('stopTaskBtn');
            const cancelButton = document.getElementById('cancelTaskBtn');
            const workflowBusy = ['publishTaskBtn', 'startTaskBtn', 'cancelTaskBtn']
                .some(id => taskActionLocks.has(id));

            if (selectedRoute) {
                selectedRoute.textContent = selection.name || '未选择';
                selectedRoute.title = selection.name || '';
            }
            if (routeSelect) {
                routeSelect.disabled = workflowBusy;
            }
            if (publishButton) {
                publishButton.disabled = !selection.id || workflowBusy;
            }
            if (startButton) {
                startButton.disabled = !selection.id || !taskRoutePublished || workflowBusy;
            }
            if (stopButton) {
                stopButton.disabled = taskActionLocks.has('stopTaskBtn');
            }
            if (cancelButton) {
                cancelButton.disabled = taskActionLocks.has('cancelTaskBtn');
            }
        }

        function resetTaskSelectionState() {
            const selection = getTaskRouteSelection();
            taskRoutePublished = false;
            if (selection.id) {
                setTaskUiState('等待发布', 'selected', '已选择路线，请先发布路线。');
            } else {
                setTaskUiState('等待选择', 'idle', '请选择路线，发布成功后才能执行任务。');
            }
            syncTaskControls();
        }

        function confirmClearCanvas() {
            if (!confirm('清屏只会清理当前页面的路线绘制、站点显示和选择状态，不会删除已保存路线。确认继续吗？')) {
                return;
            }
            clearAll();
            resetTaskSelectionState();
            cocoMessage.info('当前页面绘制内容已清理');
        }

        function beginTaskAction(buttonId, pendingLabel) {
            taskActionLocks.add(buttonId);
            const button = document.getElementById(buttonId);
            const operationSection = document.getElementById('routeOperationSection');
            if (button) {
                button.textContent = pendingLabel;
                button.setAttribute('aria-busy', 'true');
            }
            if (operationSection) {
                operationSection.setAttribute('aria-busy', 'true');
            }
            syncTaskControls();
        }

        function endTaskAction(buttonId) {
            taskActionLocks.delete(buttonId);
            const button = document.getElementById(buttonId);
            const operationSection = document.getElementById('routeOperationSection');
            if (button) {
                button.textContent = taskButtonLabels[buttonId];
                button.removeAttribute('aria-busy');
            }
            if (operationSection && taskActionLocks.size === 0) {
                operationSection.removeAttribute('aria-busy');
            }
            syncTaskControls();
        }

        function getTaskErrorMessage(error, fallback) {
            return error?.response?.data?.message || error?.message || fallback;
        }

        async function runTaskAction(buttonId, pendingLabel, fallbackError, action) {
            if (taskActionLocks.has(buttonId)) {
                return null;
            }
            beginTaskAction(buttonId, pendingLabel);
            try {
                return await action();
            } catch (error) {
                const message = getTaskErrorMessage(error, fallbackError);
                console.error(`${fallbackError}:`, error);
                setTaskUiState('操作失败', 'error', message);
                cocoMessage.error(message);
                return null;
            } finally {
                endTaskAction(buttonId);
            }
        }

        function assertSuccessfulResponse(response, operationName) {
            if (!response || Number(response.data?.code) !== 0) {
                throw new Error(response?.data?.message || `${operationName}失败，请稍后重试`);
            }
            return response;
        }

        async function vehicleControl(controlType) {
            const response = await axiosClient.post(`ros2/vehicle/${controlType}`);
            return assertSuccessfulResponse(response, operationNames[controlType] || '操作');
        }

        async function pubTask() {
            const selection = getTaskRouteSelection();
            const id = Number.parseInt(selection.id, 10);
            if (!selection.id || Number.isNaN(id)) {
                setTaskUiState('等待选择', 'idle', '请先选择需要发布的路线。');
                cocoMessage.error('请先选择需要发布的路线');
                syncTaskControls();
                return null;
            }

            return runTaskAction('publishTaskBtn', '发布中…', '路线发布失败', async () => {
                setTaskUiState('正在发布', 'busy', `正在发布路线“${selection.name}”，请勿重复点击。`);
                const response = await axiosClient.post(`ros2/publishpathpoint/${id}`);
                assertSuccessfulResponse(response, '路线发布');
                taskRoutePublished = true;
                setTaskUiState('已发布', 'ready', '路线发布成功，现在可以执行任务。');
                cocoMessage.success('路线发布成功');
                return response;
            });
        }

        // 启动
        async function starTask() {
            const selection = getTaskRouteSelection();
            if (!selection.id) {
                cocoMessage.error('请先选择路线');
                resetTaskSelectionState();
                return null;
            }
            if (!taskRoutePublished) {
                setTaskUiState('等待发布', 'selected', '请先发布当前路线，再执行任务。');
                cocoMessage.error('请先发布当前路线');
                syncTaskControls();
                return null;
            }
            if (!confirm(`确认执行路线“${selection.name}”吗？`)) {
                return null;
            }

            return runTaskAction('startTaskBtn', '启动中…', '任务启动失败', async () => {
                setTaskUiState('正在启动', 'busy', '正在发送启动命令，请勿重复点击。');
                const response = await vehicleControl(controlTypes.START);
                setTaskUiState('命令已发送', 'sent', '启动命令已发送，实际运行状态以机器人反馈为准。');
                cocoMessage.success('启动命令已发送');
                return response;
            });
        }

        // 暂停
        async function stopTask() {
            return runTaskAction('stopTaskBtn', '停止中…', '任务停止失败', async () => {
                setTaskUiState('正在停止', 'busy', '正在发送停止命令。');
                const response = await vehicleControl(controlTypes.STOP);
                taskRoutePublished = false;
                setTaskUiState('路线已取消并锁定', 'stopped', 'ROS 取消回执已收到；底盘停稳须核对速度反馈，再次执行需重新发布路线并解除软件锁定。');
                cocoMessage.success('ROS 取消回执已收到');
                return response;
            });
        }

        //取消
        async function cancelTask() {
            const selection = getTaskRouteSelection();
            const routeName = selection.name ? `路线“${selection.name}”` : '当前任务';
            if (!confirm(`确认取消${routeName}吗？`)) {
                return null;
            }

            return runTaskAction('cancelTaskBtn', '取消中…', '任务取消失败', async () => {
                setTaskUiState('正在取消', 'busy', '正在发送取消命令。');
                const response = await vehicleControl(controlTypes.CANCEL);
                taskRoutePublished = false;
                setTaskUiState('任务已取消并锁定', 'stopped', 'ROS 取消回执已收到；底盘停稳须核对速度反馈，再次执行需重新发布路线并解除软件锁定。');
                cocoMessage.success('ROS 取消回执已收到');
                return response;
            });
        }

        document.addEventListener('DOMContentLoaded', function initTaskControls() {
            const routeSelect = document.getElementById('routeSelect');
            if (!routeSelect) {
                return;
            }
            routeSelect.addEventListener('change', resetTaskSelectionState);
            const routeOptionsObserver = new MutationObserver(resetTaskSelectionState);
            routeOptionsObserver.observe(routeSelect, { childList: true });
            resetTaskSelectionState();
        });
    </script>

    <script src="./js/publishWork.js"></script>
    <script src="./js/currentPose.js"></script>
    <script src="./js/drawArrow.js"></script>
    <script src="./js/home_robot_data.js"></script>
    <!-- routeInfoModal -->
    <div id="routeInfoModal" class="route-info-modal hidden">
        <div class="route-info-content">
            <div class="route-info-field">
                <label for="routeNameInput" class="route-info-label">路线名称</label>
                <input type="text" id="routeNameInput" class="route-info-input" placeholder="请输入路线名称" />
            </div>
            <div style="display: none;" class="route-info-field">
                <label for="routeSpeedInput" class="route-info-label">速度 (m/s)</label>
                <input type="number" id="routeSpeedInput" class="route-info-input" placeholder="请输入速度" value="0.2"
                    step="0.1" min="0.1" />
            </div>
            <div class="route-info-buttons">
                <button id="routeInfoConfirm" class="route-info-btn route-info-btn-confirm">
                    确认
                </button>
                <button id="routeInfoDelete" class="route-info-btn route-info-btn-delete">
                    删除
                </button>
                <button id="routeInfoCancel" class="route-info-btn route-info-btn-cancel">
                    取消
                </button>
            </div>
        </div>
    </div>

    <!-- addStationModal -->
    <div id="addStationModal" class="route-info-modal hidden">
        <div class="route-info-content">
            <div class="route-info-field">
                <label for="stationNameInput" class="route-info-label">站点名称</label>
                <input type="text" id="stationNameInput" class="route-info-input" placeholder="请输入站点名称" />
            </div>
            <div class="route-info-field">
                <label for="stationXInput" class="route-info-label">X坐标</label>
                <input type="number" id="stationXInput" class="route-info-input" placeholder="请输入X坐标" step="0.01" />
            </div>
            <div class="route-info-field">
                <label for="stationYInput" class="route-info-label">Y坐标</label>
                <input type="number" id="stationYInput" class="route-info-input" placeholder="请输入Y坐标" step="0.01" />
            </div>
            <div class="route-info-buttons">
                <button id="addStationCancel" class="route-info-btn route-info-btn-cancel">
                    取消
                </button>
                <button id="addStationConfirm" class="route-info-btn route-info-btn-confirm">
                    确认
                </button>
            </div>
        </div>
    </div>

    <!-- 抽屉组件 -->
    <div id="pageContent">
        <!-- 自定义抽屉 -->
        <div id="customDrawer" class="custom-drawer">
            <div class="drawer-header">
                <h3>站点编辑</h3>
                <button id="closeDrawerBtn" class="close-btn">&times;</button>
            </div>
            <div class="drawer-content">
                <div class="filter-container">
                    <div class="input-group">
                        <input type="text" id="filterInput" class="form-control" placeholder="搜索站点名称...">
                        <button class="btn btn-outline-secondary" id="resetFilterBtn">重置筛选</button>
                    </div>
                </div>
                <div class="list-container">
                    <ul class="list-group" id="itemList">
                        <!-- 列表项将通过JavaScript动态添加 -->
                    </ul>
                </div>
            </div>
        </div>
        <!-- 抽屉遮罩层 -->
        <div id="drawer-overlay" class="drawer-overlay"></div>
    </div>
    <!-- 全局设置模态框 -->
    <div class="modal fade" id="globalSettingsModal" tabindex="-1" aria-labelledby="globalSettingsModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="globalSettingsModalLabel">全局设置</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- 全局设置内容 -->
                    <div id="global-settings-container">
                        <div class="mb-3" style="display: flex; align-items: baseline;">
                            <label for="globalRouteSpeed" class="form-label">路线默认速度 (m/s)</label>
                            <input type="number" id="globalRouteSpeed" style="max-width: 100px; margin-left: 10px;"
                                class="form-control" step="0.1" min="-1" max="1" value="0.2">
                        </div>
                        <div class="mb-3">
                            <label for="globalDefaultDirection" class="form-label">站点默认方向:</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="directionOption" id="useNextPoint"
                                    value="useNextPoint" checked>
                                <label class="form-check-label" for="useNextPoint">
                                    指向下一点
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="directionOption" id="keepDirection"
                                    value="keepDirection">
                                <label class="form-check-label" for="keepDirection">
                                    保持当前方向
                                </label>
                            </div>
                            <div style="display: flex; align-items: normal;" class="form-check">
                                <input class="form-check-input" type="radio" name="directionOption" id="useAngle"
                                    value="useAngle">
                                <label for="useAngle">
                                    使用输入角度:
                                </label>
                                <div style="min-width: 50px;  border-radius: 3px;   margin-left: 20px; display: none;"
                                    id="directionInputContainer">
                                    <input type="number" style="min-width: 50px; border: 1px solid #ced4da;"
                                        id="globalDefaultDirection" placeholder="输入角度值" min="-180" max="180">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3" style="display: none;   align-items: end;">
                            <label for="globalNavigationMode" class="form-label">导航模式:</label>
                            <select id="globalNavigationMode" style="margin-left: 20px;" class="form-select">
                                <option value="1">室内</option>
                                <option value="2">室外</option>
                            </select>
                        </div>
                        <div class="mb-3" style="display: flex;  align-items: end;">
                            <label for="globalLanechange" class="form-label">变道绕障:</label>
                            <select id="globalLanechange" class="form-select" style="width: 160px;  margin-left: 20px;">
                            <option value="0">禁止变道</option>
                            <option value="1">左变道</option>
                            <option value="2">右变道</option>
                            <option value="3">左右均可变道</option>
                            <option value="4">关闭变道和绕障</option>
                            </select>
                        </div>

                        <div class="mb-3" style="display: flex;">
                            <label class="form-label">转弯模式:</label>
                            <div style="display: flex; align-items: center;">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="turnMode" id="turnModeSelf"
                                        value="1">
                                    <label class="form-check-label" for="turnModeSelf">
                                        自转模式
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="turnMode" id="turnModeContinuous"
                                        value="0">
                                    <label class="form-check-label" for="turnModeContinuous">
                                        连续模式
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 当前路线设置内容 -->
                    <div id="current-route-settings-container">
                        <div class="mb-3" style="display: flex; align-items: baseline;">
                            <label for="currentRouteName" class="form-label">当前路线名称</label>
                            <input type="text" id="currentRouteName" class="form-control"
                                style="max-width: 200px; margin-left: 10px;">
                            <div class="form-check" style="margin-left: 10px;">
                                <input class="form-check-input" type="checkbox" id="updateRouteName">
                                <label class="form-check-label" for="updateRouteName">更新</label>
                            </div>
                        </div>
                        <div class="mb-3" style="display: flex; align-items: baseline;">
                            <label for="currentRouteSpeed" class="form-label">当前路线速度 (m/s)</label>
                            <input type="number" id="currentRouteSpeed" class="form-control"
                                style="max-width: 100px; margin-left: 10px;" class="form-control" step="0.1" min="-1"
                                max="1">
                            <div class="form-check" style="margin-left: 10px;">
                                <input class="form-check-input" type="checkbox" id="updateSpeed">
                                <label class="form-check-label" for="updateSpeed">更新</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="currentRouteDirection" class="form-label">站点默认方向:</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="currentDirectionOption"
                                    id="currentUseNextPoint" value="useNextPoint">
                                <label class="form-check-label" for="currentUseNextPoint">
                                    指向下一点
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="currentDirectionOption"
                                    id="currentKeepDirection" value="keepDirection">
                                <label class="form-check-label" for="currentKeepDirection">
                                    保持原方向
                                </label>
                            </div>
                            <div style="display: flex; align-items: normal;" class="form-check">
                                <input class="form-check-input" type="radio" name="currentDirectionOption"
                                    id="currentUseAngle" value="useAngle" checked>
                                <label for="currentUseAngle">
                                    使用输入角度:
                                </label>
                                <div style="min-width: 50px;  border-radius: 3px;   margin-left: 20px; display: none;"
                                    id="currentDirectionInputContainer">
                                    <input type="number" style="min-width: 50px; border: 1px solid #ced4da;"
                                        id="currentRouteDirection" placeholder="输入角度值" min="-180" max="180" value="0">
                                </div>
                            <div class="form-check" style="margin-left: 10px;">
                                <input class="form-check-input" type="checkbox" id="updateDirection">
                                <label class="form-check-label" for="updateDirection">更新</label>
                            </div>
                        </div>
                        
                        <!-- 添加变道模式设置 -->
                        <div class="mb-3" style="margin-bottom: 15px; ">
                            <label for="currentRouteAvoid" class="form-label" style="display: block; font-size: 13px; margin-bottom: 6px; color: #333; font-weight: 500;">变道模式:</label>
                            <select id="currentRouteAvoid"
                                style="width: 100%;  border: 1px solid #ddd; border-radius: 4px; font-size: 13px; background-color: #f9f9f9;">
                                    <option value="0">禁止变道</option>
                                    <option value="1">左变道</option>
                                    <option value="2">右变道</option>
                                    <option value="3">左右均可变道</option>
                                    <option value="4">关闭变道和绕障</option>
                            </select>
                            <div class="form-check" style="margin-left: 10px; margin-top: 5px;">
                                <input class="form-check-input" type="checkbox" id="updateRouteAvoid">
                                <label class="form-check-label" for="updateRouteAvoid">更新</label>
                            </div>
                        </div>
                        <div class="mb-3" style="display: none;   align-items: end;">
                            <label for="currentRouteNavigationMode" class="form-label">导航模式:</label>
                            <select id="currentRouteNavigationMode" style="margin-left: 20px;" class="form-select">
                                <option value="1">室内</option>
                                <option value="2">室外</option>
                            </select>
                            <div class="form-check" style="margin-left: 10px;">
                                <input class="form-check-input" type="checkbox" id="updateNavigationMode">
                                <label class="form-check-label" for="updateNavigationMode">更新</label>
                            </div>
                        </div>
                        
                        <div class="mb-3" style="display: flex; align-items: center;">
                            <label class="form-label">转弯模式:</label>
                            <div style="display: flex; align-items: center;">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="currentTurnMode" id="currentTurnModeSelf" value="1" checked>
                                    <label class="form-check-label" for="currentTurnModeSelf">
                                        自转模式
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="currentTurnMode" id="currentTurnModeContinuous" value="0">
                                    <label class="form-check-label" for="currentTurnModeContinuous">
                                        连续模式
                                    </label>
                                </div>
                                <div class="form-check" style="margin-left: 10px;">
                                    <input class="form-check-input" type="checkbox" id="updateTurnMode">
                                    <label class="form-check-label" for="updateTurnMode">更新</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="saveGlobalSettings">保存设置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 单台 Livox Mid-360 或 Mid-360S 配置抽屉 -->
    <script src="./js/radar_drawer.js?v=20260924"></script>
</body>
