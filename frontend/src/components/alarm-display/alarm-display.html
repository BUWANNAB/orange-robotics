<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报警信息展示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/alarm-display.css">
</head>
<body>
    <!-- 报警信息展示组件 -->
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="alarm-container">
                    <!-- 标题栏 -->
                    <div class="alarm-header">
                        <h4 class="mb-0">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            报警信息监控
                        </h4>
                        <div class="alarm-controls">
                            <button class="btn btn-sm btn-outline-secondary" id="refreshAlarms">
                                <i class="bi bi-arrow-clockwise"></i>
                                刷新
                            </button>
                            <button class="btn btn-sm btn-outline-danger" id="clearAllAlarms">
                                <i class="bi bi-trash"></i>
                                清除全部
                            </button>
                        </div>
                    </div>

                    <!-- 统计信息 -->
                    <div class="alarm-stats">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <div class="stat-card error">
                                    <div class="stat-icon">
                                        <i class="bi bi-x-circle-fill"></i>
                                    </div>
                                    <div class="stat-info">
                                        <div class="stat-number" id="errorCount">0</div>
                                        <div class="stat-label">错误报警</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-card warning">
                                    <div class="stat-icon">
                                        <i class="bi bi-exclamation-triangle-fill"></i>
                                    </div>
                                    <div class="stat-info">
                                        <div class="stat-number" id="warningCount">0</div>
                                        <div class="stat-label">警告报警</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-card info">
                                    <div class="stat-icon">
                                        <i class="bi bi-info-circle-fill"></i>
                                    </div>
                                    <div class="stat-info">
                                        <div class="stat-number" id="infoCount">0</div>
                                        <div class="stat-label">信息报警</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="stat-card total">
                                    <div class="stat-icon">
                                        <i class="bi bi-list-ul"></i>
                                    </div>
                                    <div class="stat-info">
                                        <div class="stat-number" id="totalCount">0</div>
                                        <div class="stat-label">总报警数</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 筛选器 -->
                    <div class="alarm-filters">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <select class="form-select" id="levelFilter">
                                    <option value="">所有级别</option>
                                    <option value="error">错误</option>
                                    <option value="warning">警告</option>
                                    <option value="info">信息</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="datetime-local" class="form-control" id="startTimeFilter">
                            </div>
                            <div class="col-md-3">
                                <input type="datetime-local" class="form-control" id="endTimeFilter">
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-primary w-100" id="applyFilters">
                                    <i class="bi bi-funnel"></i>
                                    应用筛选
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 报警列表 -->
                    <div class="alarm-list" id="alarmList">
                        <!-- 报警项目将通过JavaScript动态添加 -->
                    </div>

                    <!-- 空状态 -->
                    <div class="empty-state" id="emptyState">
                        <i class="bi bi-check-circle-fill"></i>
                        <h5>暂无报警信息</h5>
                        <p>系统运行正常，未发现报警信息</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 报警详情模态框 -->
    <div class="modal fade" id="alarmDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        报警详情
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="alarmDetailContent">
                    <!-- 详情内容将通过JavaScript填充 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="acknowledgeAlarm">
                        <i class="bi bi-check-circle"></i>
                        确认报警
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/alarm-display.js"></script>
</body>
</html>
