        function triggerIframeGetPoseBtn() {
            var iframe = document.getElementById("myIframe");
            var iframeDocument = iframe.contentWindow.document || iframe.contentDocument;
            var iframeGetPoseButton = iframeDocument.getElementById('getPoseBtn');
            if (iframeGetPoseButton) {
                // 触发点击事件
                iframeGetPoseButton.click();

            }
            document.getElementById("save_data").style.display = "block";
        }
        function triggerIframeSavePoseBtn() {
            var iframe = document.getElementById("myIframe");
            var iframeDocument = iframe.contentWindow.document || iframe.contentDocument;
            var iframeSavePoseButton = iframeDocument.getElementById('savePoseBtn');
            if (iframeSavePoseButton) {
                // 触发点击事件
                iframeSavePoseButton.click();
                document.getElementById("save_data").style.display = "none";
            }
        }

    <script type="text/javascript" src="../../../src/libs/roslib.min.js"></script>

    <script type="module">
        import RosManager from '../../../src/rosManage/RosManager.js';
        import axiosClient from "../../../src/api/ApiManager.js";
        const rosManager = new RosManager();
        // 订阅 rossub 话题
        rosManager.subscribeGeneralTopic("RemoteCtrlAutomaticSwitch", "std_msgs/msg/UInt8", (message) => {
            console.log("收到RemoteCtrlAutomaticSwitch 消息:", message.data);
        });
        function switchToAutoMode() {
            const newMode = {
                "manual": 0,//手动模式
                "auto": 1,//自动模式
            }
            if (localStorage.getItem('currentInterface') == '3') {
                const response = axiosClient.post(`ros2/mode/${newMode.manual}`);
            }
        }
        switchToAutoMode()
        // 模拟发布一条消息到 RemoteCtrlAutomaticSwitch 话题
        function publishHandMove() {
            const message = new ROSLIB.Message({
                data: 0,
            });
            rosManager.publishGeneralTopic("RemoteCtrlAutomaticSwitch", "std_msgs/msg/UInt8", message);
            console.log("消息已发布:", message.data);
        }
        // 等待所有iframe加载完成后再发布消息
        window.onload = () => {
            const iframes = document.querySelectorAll('iframe');
            let loadedIframes = 0;

            if (iframes.length === 0) {
                // 如果没有iframe，直接发布
                publishHandMove();
                return;
            }

            // 为每个iframe添加加载完成监听器
            iframes.forEach(iframe => {
                iframe.addEventListener('load', () => {
                    loadedIframes++;
                    console.log(`Iframe加载完成: ${loadedIframes}/${iframes.length}`);

                    // 当所有iframe都加载完成后发布消息
                    if (loadedIframes === iframes.length) {
                        console.log('所有iframe加载完成，开始发布消息');
                        publishHandMove();
                    }
                });

                // 如果iframe已经加载完成（缓存的情况）
                if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
                    loadedIframes++;
                    console.log(`Iframe已缓存加载: ${loadedIframes}/${iframes.length}`);

                    if (loadedIframes === iframes.length) {
                        console.log('所有iframe加载完成，开始发布消息');
                        publishHandMove();
                    }
                }
            });
        }

            if (target === '#addSite') {
                currentPagStatus = 1
                console.log('当前在添加站点信息界面');

                console.log('当前在添加临时站点界面');

        let latitudeCurrent;
        let longitudeCurrent;
        function interVal() {
            // 从positionData JSON对象中获取经纬度
            const positionDataStr = localStorage.getItem('positionData');

            if (positionDataStr) {
                try {
                    const positionData = JSON.parse(positionDataStr);
                    longitudeCurrent = positionData.longitudeCurrent;
                    latitudeCurrent = positionData.latitudeCurrent;
                } catch (e) {
                    console.error("解析positionData失败:", e);
                    longitudeCurrent = null;
                    latitudeCurrent = null;
                }
            } else {
                longitudeCurrent = null;
                latitudeCurrent = null;
            }

            updateMsg();
        }
        document.addEventListener('DOMContentLoaded', (event) => {
            interVal()
            document.body.addEventListener('click', function (e) {
                if (e.target && e.target.id == 'addNewPoint') {
                    if (currentPagStatus == 1) {
                        addCuurrentPoint();
                    } else {

                        addinTerimCuurrentPoint()
                    }
                }
            });
        });


        document.getElementById("getCurrentPositonXY").addEventListener("click", getCurrentPositonXY)
        setInterval(() => {
            interVal()

        function updateMsg() {
            if (!latitudeCurrent || !longitudeCurrent || longitudeCurrent == "未运行") {
                // 设置占位符文本
                document.getElementById('siteName').setAttribute('placeholder', '请输入站点名称');
                document.getElementById('addlongitude').setAttribute('placeholder', '未找到机器的位置,请输入');
                document.getElementById('addlatitude').setAttribute('placeholder', '未找到机器的位置,请输入');
                // 设置占位符文本
                document.getElementById('tempSiteName').setAttribute('placeholder', '请输入站点名称');
                document.getElementById('tempLongitude').setAttribute('placeholder', '未找到机器的位置,请输入');
                document.getElementById('tempLatitude').setAttribute('placeholder', '未找到机器的位置,请输入');
            } else {
                document.getElementById('addlongitude').value = longitudeCurrent;
                document.getElementById('addlatitude').value = latitudeCurrent;
                document.getElementById('tempLongitude').value = longitudeCurrent;
                document.getElementById('tempLatitude').value = latitudeCurrent;
            }
        }
        async function getCurrentPositonXY() {
            updateMsg()
            // 显示模态框
            document.getElementById('addlongitude').value = "";
            document.getElementById('addlatitude').value = "";
            document.getElementById('tempLongitude').value = "";
            document.getElementById('tempLatitude').value = "";

            //         existingData = [];

            //     const latitudeValue = parseFloat(allparams.latitude);
            //     const longitudeValue = parseFloat(allparams.longitude);
            //     // 将新数据追加到数组中
            //     if(typeof latitudeValue =="number" && typeof longitudeValue =="number" ){
            //         existingData.push(allparams);
            //     }else{
            //         cocoMessage.error("经纬度必须是数字")
            //         return
            //     }
            //     console.log(typeof allparams.latitude =="number" ,typeof allparams.longitude =="number",typeof allparams.latitude =="number" && typeof allparams.longitude =="number");

            //     // 将更新后的数组保存到 localStorage 中
            //     localStorage.setItem('temporaryStations', JSON.stringify(existingData));
            //     removeInputValue();
            //     myModal.hide();
            // } else {
            //     cocoMessage.error("新增失败，经纬度不能为空");
            //     myModal.hide();
            //     removeInputValue();
            // }
        }
        async function addCuurrentPoint() {
            // 示例：简单地关闭模态框
            var myModal = bootstrap.Modal.getInstance(document.getElementById('exampleModal'));
            let siteName = document.getElementById('siteName').value;
            let addlongitude = document.getElementById('addlongitude').value;
            let addlatitude = document.getElementById('addlatitude').value;
            let allparams = {
                latitude: addlatitude,
                longitude: addlongitude,
                positionX: 0,
                positionY: 0,
                positionZ: 0,
                orientationX: 0,
                orientationY: 0,
                orientationZ: 0,
                orientationW: 0,
                stationName: siteName, // 添加站点名称到参数中
                stationCode: 2
            };

            try {
                // await inputPsw(); // 等待密码验证成功
                if (addlongitude && addlatitude) {
                    axiosClient.post("station/add", allparams)
                        .then((res) => {
                            let flag = res.data.code;
                            if (!flag) { // 假设code为false表示成功
                                cocoMessage.success("新添成功");
                                mapPage.contentWindow.postMessage("Hello from parent!", "*");
                                removeInputValue();
                                myModal.hide();
                            } else {
                                cocoMessage.error("新增失败，请勿重复名字");
                                myModal.hide();
                                removeInputValue();
                            }
                        })
                        .catch((error) => {
                            console.log("catch", error);
                        });
                } else {
                    cocoMessage.error("新增失败，经纬度不能为空");
                }
            } catch (e) {
                // 如果用户取消了输入或者密码多次错误导致放弃，这里可以处理异常情况
                console.log(e); // 或者其他的异常处理逻辑
            }
        }
        function inputPsw() {
            return new Promise((resolve, reject) => {
                const password = prompt("请输入密码：");
                if (password !== null) { // 用户点击了确定按钮
                    if (checkPassword(password)) {
                        resolve(); // 密码正确，继续执行
                    } else {
                        alert("密码错误，请重试");
                        inputPsw().then(resolve).catch(reject); // 递归调用，直到密码正确
                    }
                } else { // 用户点击了取消按钮
                    reject(new Error("用户取消了密码输入")); // 用户取消输入，抛出异常
                }
            });
        }
