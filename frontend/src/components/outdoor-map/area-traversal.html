    <script type="module">
        import RosManager from "../../rosManage/RosManager.js";
        import axiosClient from "../../api/ApiManager.js";
        import webSocketUtil from "../../tools/webSocketUtil.js";
        const rosManager = new RosManager();
        var map;
        let toggleStatus = false;
        let dragStatus = false; // 初始状态为禁止拖动
        let editStatus = false; // 编辑模式初始状态
        var markers = [];
        var routePoints = [];
        var currentPolyline = null;
        let alldata = [];  //路线数据
        var editableMarkers = []; // 用于存储编辑模式下的可拖动标记
        // 在全局变量声明部分添加新变量
        var randomMarker = null;
        let stationVisibility = false; // 初始状态为显示站点
        let stationData = null;
        //所有站点的数据
        let allStationData = null
        let longitudeCurrent = null //当前机器的经度
        let latitudeCurrent = null//当前机器维度
        let currentAvoidArr = []//当前数组信息
        let allowAddingStations = false; //当前的状态
        let callbackStatus = 1
        let dragChangeStatus = true
        let importPortPoint = []
        //当前路线选中的回归原始点的位置
        let currentLastPoint = null;
        //这是运行，暂停的话题部分
        let selectedValue; // 终点的索引
        let lastPointMarker;//预览最后一个点
        let firstPointMarker;//预览第一个点
        let markers1 = []
        let borderLine = []
        let preViewRouteData = []
        let currentBorderLine = [];
        let currentBorderRoutePolyline = null;
        //地图默认载入的数据
        let initlongitudeCurrent = null
        let initlatitudeCurrent = null
        // 全局变量：机器位置标记（使用更清晰的变量名）
        let machineMarker; // 机器实时位置标记
        let temporary = [] //临时文件
        let pointData = null
        // 假设这是你的点数据
        let localX = null
        let localY = null
        let linePreview = null; // 预览路线
        let preViewRouteStatus = true; // 预览状态（注意：这里初始值建议设为false，根据你的需求调整）
        let startMarker = null;
        let endMarker = null;
        let allImportPoint = null;
        let needPoint = 0;
        let already = 0;
        // 全局变量区分两种标记
        let globalStations = []; // 数据库中的全局站点标记（唯一）
        let routeMarkers = [];   // 路线规划时的临时标记（可删除）
        let pointInterval
        let carCurrentRunStatus = null
        let limtmodel = 0
        rosManager.gpsSub.subscribe(function (message) {
            latitudeCurrent = message.data[2]
            longitudeCurrent = message.data[3]
        })
        setInterval(() => {
            getPose()
        }, 800);
        function getPose() {
            localStorage.setItem("latitudeCurrent", latitudeCurrent)
            localStorage.setItem("longitudeCurrent", longitudeCurrent)
        }


        function publishHandMove() {
            const message = new ROSLIB.Message({
                data: 1,
            });
            rosManager.publishGeneralTopic("RemoteCtrlAutomaticSwitch", "std_msgs/msg/UInt8", message);
            console.log("消息已发布:", message.data);
        }
        window.onload = () => {
            publishHandMove()
        }

        const currentHostname = window.location.hostname;
        let wsUrl;
        // 根据不同的hostname采用不同的WebSocket连接策略
        if (currentHostname.includes('127.0.0.1') || currentHostname.includes('localhost') || currentHostname.includes('192.168.')) {
            // 本地环境使用当前hostname和8088端口
            wsUrl = `ws://${currentHostname}:8088/ws/test1`;
        } else {
            // 公网环境将hostname中的"-web"替换为"-rosbridge"，并去掉端口号
            const rosbridgeHostname = currentHostname.replace('-web', '-rosbridge');
            wsUrl = `ws://${rosbridgeHostname}/ws/test1`;
        }
        console.log('构建的WebSocket地址:', wsUrl);
        // 销毁旧实例，确保使用新地址
        webSocketUtil.destroyInstance(wsUrl);
        let websocket = webSocketUtil.getInstance(wsUrl);
        window.addEventListener('beforeunload', () => {
            console.log("页面即将卸载")
            // 页面卸载时不需要关闭连接，其他页面可能还在使用
        });
        document.addEventListener('DOMContentLoaded', function () {
            // renderTemStations()
        });
        websocket.subscribe('message', (data) => {
            if (data.action === "PATHPOINT") {
                needPoint = data.pointnum
                already = data.pointsendnum
                console.log(needPoint, already, "already");
            }
            // 检查 action 是否为 carCurrentPosition
            if (data.action === "carCurrentPosition") {
                carCurrentRunStatus = data.position.routeEnd
                console.log(data.position.routeEnd, "data.position.routeEnd");

                if (carCurrentRunStatus == 1) {
                    needPoint = 0;
                    already = 0;
                }
                if (data.position.runStatus == 0) {
                    $("#btnSend").val("Stop");
                    $("#btnSend").text("运行");
                    $("#btnSend").removeClass("btn-warning");
                    $("#btnSend").addClass("btn-success");
                }
                else if (data.position.runStatus == 1) {
                    $("#btnSend").val("Run");
                    $("#btnSend").text("暂停");
                    $("#btnSend").removeClass("btn-success");
                    $("#btnSend").addClass("btn-warning");

                }
                // carCurrentX = data.orientation.qx;
                // carCurrentY = data.orientation.qy;
                // latitudeCurrent = data.position.Lat;

        //定时检查函数
        // 辅助函数：等待条件满足或超时
        function waitForCondition(conditionFn, timeout, interval) {
            return new Promise((resolve, reject) => {
                // 立即检查一次条件
                if (conditionFn()) {
                    resolve();
                    return;
                }
                // 设置超时
                const timeoutId = setTimeout(() => {
                    clearInterval(intervalId);
                    reject(new Error("timeout"));
                }, timeout);

                // 定期检查条件
                const intervalId = setInterval(() => {
                    if (conditionFn()) {
                        clearInterval(intervalId);
                        clearTimeout(timeoutId);
                        resolve();
                    }
                }, interval);
            });
        }

        // 修改drawPreviewRoute函数（关键修改点）
        function drawPreviewRoute(stations) {
            const thisPoints = []; // Leaflet坐标数组（lat, lng顺序）

            // 转换坐标格式（重要：Leaflet使用lat在前，lng在后）
            for (const station of stations) {
                if (typeof station.lat === 'string' && typeof station.lng === 'string') {
                    thisPoints.push(L.latLng(
                        parseFloat(station.lat),  // 纬度在前
                        parseFloat(station.lng)   // 经度在后
                    ));
                } else {
                    console.log("无效坐标点：", station);
                }
            }

            if (thisPoints.length === 0) {
                cocoMessage.error("没有有效的点来绘制路线");
                return;
            }

            // 创建并添加路线（使用Leaflet的Polyline）
            const lineOptions = {
                color: '#FF0000',       // 红色路线
                weight: 5,              // 线宽
                opacity: 0.8,           // 透明度
                dashArray: '10, 5',     // 虚线样式
                clickable: false        // 路线不可点击
            };

            // 移除旧路线（如果存在）
            if (linePreview) map.removeLayer(linePreview);

        function loadRoute(routeId) {
            // 清除现有路线元素
            if (currentRoutePolyline) map.removeLayer(currentRoutePolyline);
            editableMarkers.forEach(marker => map.removeLayer(marker));
            editableMarkers = [];

            // 获取路线数据
            const selectedRoute = alldata.find(r => r.routeId == routeId);
            if (!selectedRoute) return;

            // 创建可拖拽标记
            const routePoints = selectedRoute.stations.map(station => {
                const marker = L.marker([station.latitude, station.longitude], {
                    draggable: true,
                    icon: L.icon({
                        iconUrl: '../../assets/imges/原点.png',
                        title: station.stationName,
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    })
                }).addTo(map);
                marker.bindTooltip(station.stationName, {
                    permanent: true,
                    direction: 'right',
                    offset: [10, 0],
                    className: 'station-label'
                });
                // 绑定拖拽事件
                marker.on('dragend', function (e) {
                    const updatedPosition = e.target.getLatLng();
                    // 更新routePoints中的对应点
                    let index = routePoints.findIndex(point =>
                        point.lat === marker.originalData.position.lat &&
                        point.lng === marker.originalData.position.lng
                    );
                    if (index !== -1) {
                        routePoints[index] = updatedPosition;
                        updatePolyline(); // 更新Polyline
                    }
                    // 更新marker的原始位置为新位置，以便下次拖动
                    marker.originalData.position = updatedPosition;

                    // 移除旧的标记
                    map.removeLayer(marker);
                    // 将更新后的标记重新添加到地图上
                    marker.setLatLng(updatedPosition);
                    map.addLayer(marker);
                });

                editableMarkers.push(marker);
                return marker.getLatLng();
            });

            // 绘制动态折线
            currentRoutePolyline = L.polyline(routePoints, {
                color: 'green',
                weight: 3
            }).addTo(map);
            map.setView(routePoints[0], selectedRoute.mapCoverage);
            // 聚焦首站点
            map.setView(routePoints[0], 18);
        }

                marker.on('dragend', async function (e) {
                    const updatedPosition = e.target.getLatLng();
                    // 更新routePoints中的对应点
                    let index = routePoints.findIndex(point =>
                        point.lat === marker.originalData.position.lat &&
                        point.lng === marker.originalData.position.lng
                    );
                    if (index !== -1) {
                        routePoints[index] = updatedPosition;
                        addUpdatePolyline();
                    }
                    // 更新marker的原始位置为新位置，以便下次拖动
                    marker.originalData.position = updatedPosition;

                    if (marker.originalData.id) {
                        updatePoint(marker.originalData.id.id, marker.originalData.position.lng, marker.originalData.position.lat);
                        await getAllRoute();
                        await getAllCurrentPoint();
                    }
                });
            });
        }
        function enableEditing(startEndSame) {
            markers.forEach(marker => {
                // 保存原始位置和数据以备撤回操作使用
                marker.originalData = {
                    position: marker.getLatLng(),
                    id: stationData.find(item =>
                        item.latitude === marker.getLatLng().lat &&
                        item.longitude === marker.getLatLng().lng
                    )
                };

                if (dragChangeStatus) {
                    marker.dragging.enable(); // 确保可以拖动
                }
                marker.on('dragend', async function (e) {
                    const updatedPosition = e.target.getLatLng();
                    // 更新routePoints中的对应点
                    let index = routePoints.findIndex(point =>
                        point.lat === marker.originalData.position.lat &&
                        point.lng === marker.originalData.position.lng
                    );
                    if (index !== -1) {
                        routePoints[index] = updatedPosition;

                        // 如果起点和终点重合且拖动的是起点，更新终点的位置
                        if (index === 0) {
                            routePoints[routePoints.length - 1] = routePoints[0];
                            // 找到终点对应的标记并更新其位置
                            const endMarker = markers.find(m => {
                                const pos = m.getLatLng();
                                return Math.abs(pos.lat - marker.originalData.position.lat) < 1e-6 &&
                                    Math.abs(pos.lng - marker.originalData.position.lng) < 1e-6;
                            });
                            if (endMarker) {
                                endMarker.setLatLng(updatedPosition);
                            }
                        }

                        // 如果起点和终点不重合，更新连线的终点位置
                        if (!startEndSame && index === 0) {
                            const newRoutePoints = [...routePoints];
                            newRoutePoints.push(updatedPosition); // 更新连线的终点位置
                            if (currentPolyline) map.removeLayer(currentPolyline);
                            currentPolyline = L.polyline(newRoutePoints, { color: 'green' }).addTo(map);
                        }

                        updatePolyline(); // 更新Polyline
                    }
                    // 更新marker的原始位置为新位置，以便下次拖动
                    marker.originalData.position = updatedPosition;

                    if (marker.originalData.id) {
                        updatePoint(marker.originalData.id.id, marker.originalData.position.lng, marker.originalData.position.lat);
                        await getAllRoute();
                        await getAllCurrentPoint();
                    }
                });
            });
        }

        function updatePolyline() {
            if (currentPolyline) map.removeLayer(currentPolyline); // 移除旧的Polyline
            if (routePoints.length > 0) { // 如果还有路线点，则根据新的路线点绘制Polyline
                const newRoutePoints = [...routePoints];
                const startEndSame = routePoints.length > 1 &&
                    Math.abs(routePoints[0].lat - routePoints[routePoints.length - 1].lat) < 1e-6 &&
                    Math.abs(routePoints[0].lng - routePoints[routePoints.length - 1].lng) < 1e-6;
                if (!startEndSame) {
                    newRoutePoints.push(routePoints[0]); // 连接起点和终点
                }
                currentPolyline = L.polyline(newRoutePoints, { color: 'green' }).addTo(map);
            } else {
                currentPolyline = null; // 没有路线点时，设置currentPolyline为null
            }
        }

        function callBack() {
            if (limtmodel == 3) {
                return
            }
            if (callbackStatus == 0) {
                if (routePoints.length === 0) return;
                // 获取被移除的坐标点
                const removedPoint = routePoints.pop();
                let lat = removedPoint[0]
                let lng = removedPoint[1]

                // 移除对应的标记
                let foundMarkerIndex = -1;
                for (let i = 0; i < editableMarkers.length; i++) {
                    const markerLatLng = editableMarkers[i].getLatLng();
                    if (Math.abs(markerLatLng.lat - lat) < 1e-6 && Math.abs(markerLatLng.lng - lng) < 1e-6) {
                        foundMarkerIndex = i;
                        break;
                    }
                }
                if (foundMarkerIndex > -1) {
                    const markerToRemove = editableMarkers[foundMarkerIndex];
                    map.removeLayer(markerToRemove); // 从地图上移除标记
                    editableMarkers.splice(foundMarkerIndex, 1); // 从editableMarkers中移除
                    markers.splice(markers.indexOf(markerToRemove), 1); // 从markers中移除
                }

                // 更新折线显示
                if (currentRoutePolyline) map.removeLayer(currentRoutePolyline); // 移除旧的折线

                if (routePoints.length > 0) {
                    currentRoutePolyline = L.polyline(routePoints, { color: 'green', weight: 3 }).addTo(map);
                } else {
                    currentRoutePolyline = null;
                }
            } else if (callbackStatus == 1) {
                // 这是新增路线可以使用的
                if (routePoints.length === 0) return;
                // 获取被移除的坐标点
                const removedPoint = routePoints.pop();
                const { lat, lng } = removedPoint;

                // 检查是否属于预设站点（含容差比较）
                const isPresetStation = stationData.some(station =>
                    Math.abs(station.latitude - lat) < 1e-6 &&
                    Math.abs(station.longitude - lng) < 1e-6
                );

                // 判断撤回的点是否为起点
                const isStartPoint = routePoints.length > 0 &&
                    Math.abs(routePoints[0].lat - lat) < 1e-6 &&
                    Math.abs(routePoints[0].lng - lng) < 1e-6;

                // 如果不是起点且不是预设点，移除标记
                if (!isStartPoint && !isPresetStation) {
                    markers.forEach((marker, index) => {
                        const markerLatLng = marker.getLatLng();
                        if (Math.abs(markerLatLng.lat - lat) < 1e-6 &&
                            Math.abs(markerLatLng.lng - lng) < 1e-6) {
                            map.removeLayer(marker);
                            markers.splice(index, 1); // 更新标记数组
                        }
                    });
                }
                // 更新折线显示
                if (currentPolyline) map.removeLayer(currentPolyline);
                if (routePoints.length > 0) {
                    currentPolyline = L.polyline(routePoints, { color: 'green' }).addTo(map);
                } else {
                    currentPolyline = null;
                }

            }
        }

                    const itemId = parseInt(listItem.dataset.id);
                    await axiosClient
                        .delete("station/delete/" + itemId)

                            let flag = res.data.code;
                            if (!flag) {
                                cocoMessage.success("删除成功");
                                await deleteCurrentRoute();
                                await getAllCurrentPoint();
                                await renderStations();
                            } else {
                                cocoMessage.error("删除失败");
                            }
                        })
                        .catch((error) => {
                            console.log("catch");
                        });

                    // 记录当前滚动位置
                    const scrollTop = itemList.parentElement.scrollTop;

                    // 添加删除动画
                    listItem.classList.add('deleting');

                    // 动画结束后删除元素
                    setTimeout(() => {
                        // 从原始数据中删除
                        originalItems = originalItems.filter(item => item.id !== itemId);

                        // 重新应用筛选
                        applyFilter();

                        // 恢复滚动位置（考虑到列表高度变化）
                        itemList.parentElement.scrollTop = adjustScrollPosition(scrollTop, listItem.offsetHeight);
                    }, 300);
                }
            };

            itemList.addEventListener('click', deleteClickListener);

            // 筛选功能（仅文本筛选）
            filterInput.addEventListener('input', applyFilter);
            resetFilterBtn.addEventListener('click', resetFilter);
            // 应用筛选（仅文本匹配）
            function applyFilter() {
                const searchTerm = filterInput.value.toLowerCase().trim();
                filteredItems = originalItems.filter(item =>
                    item.stationName.toLowerCase().includes(searchTerm)
                );
                renderItems(filteredItems);
            }

            // 重置筛选
            function resetFilter() {
                filterInput.value = '';
                applyFilter();
            }

            // 创建列表项元素
            function createListItem(item) {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.dataset.id = item.id;
                li.innerHTML = `
          ${item.stationName}
          <button class="btn btn-sm btn-danger delete-btn">
            <i class="bi bi-trash"></i> 删除
          </button>
        `;
                return li;
            }

            // 渲染列表
            function renderItems(items) {
                itemList.innerHTML = '';
                items.forEach(item => {
                    const li = createListItem(item);
                    itemList.appendChild(li);
                });
            }

            // 调整滚动位置
            function adjustScrollPosition(originalScrollTop, deletedItemHeight) {
                return Math.max(0, originalScrollTop - deletedItemHeight);
            }
        }

    </script>

    <!-- <script src="./js/map-loading.js"></script> -->

    <!-- 页面特定的地图加载逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 显示加载动画
            if (window.mapLoadingManager) {
                window.mapLoadingManager.show('地图加载中...', 'dark');
            }

            // 监听地图初始化完成事件
            function checkMapLoaded() {
                // 检查地图是否已初始化完成
                if (window.map && window.map._container) {
                    // 地图加载完成，隐藏加载动画
                    if (window.mapLoadingManager) {
                        setTimeout(() => {
                            window.mapLoadingManager.hide(500);
                        }, 1000);
                    }
                } else {
                    // 继续检查
                    setTimeout(checkMapLoaded, 100);
                }
            }

            // 开始检查地图加载状态
            setTimeout(checkMapLoaded, 500);
        });
    </script>
</body>

</html>
