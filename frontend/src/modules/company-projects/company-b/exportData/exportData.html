<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 引入Bootstrap 5 CSS -->

    <link href="../../../../libs/bootstrap/css5.0/bootstrap.min.css" rel="stylesheet">
    <style>
        .box {
            margin-top: 30px;
            margin-left: 30px;
            display: flex;
            align-items: center;
        }
        /* 分页样式 */
        .pagination-custom li {
            margin: 0 5px;
        }
        .pagination-custom li.disabled a {
            pointer-events: none;
            cursor: default;
            opacity: 0.65;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <img src="../../../../assets/imges/时间.png" width="30px" height="30px" alt="">
        初始时间：<input type="date" id="startDate"/>
        终止时间：<input type="date" id="endDate"/>
        每页显示：<input type="number" id="pageSize" value="15" min="1" style="width:60px;"/>
        <button id="filterData" class="btn btn-primary">筛选数据</button>
        <button id="exportFilteredData" class="btn btn-primary ms-2">导出筛选后的数据</button>
        <img id="exportFilteredDataIcon" src="../../../../assets/imges/导出 (1).png" width="30px" height="30px" alt="">
        <button id="toggleSortOrder" class="btn btn-secondary ms-2">切换排序顺序</button>
    </div>

    <table class="table table-striped mt-4" id="dataTable">
        <thead>
        <tr>
            <th>经度 (longitude)</th>
            <th>纬度 (latitude)</th>
            <th>深度 (depth)</th>
            <th>创建时间 (createTime)</th>
        </tr>
        </thead>
        <tbody>
        <!-- 动态填充数据 -->
        </tbody>
    </table>
    <nav aria-label="Page navigation">
        <ul class="pagination pagination-custom justify-content-center" id="pagination"></ul>
    </nav>
</div>

<!-- 引入必要的JS库 -->
<script type="text/javascript" src="../../../../libs/jquery-3.1.0.min.js"></script>
<script type="text/javascript" src="../../../../libs/roslib.min.js"></script>
<script type="text/javascript" src="../../../../libs/coco-message.js"></script>
<!-- <script type="module" src="../plugins/nav/station-new.js"></script> -->
<script src="../../../../libs/xlsx.full.min.js"></script>
<!-- 更新为Bootstrap 5 JS -->
<script src="../../../../libs/bootstrap/js5.0/bootstrap.bundle.min.js"></script>

<script type="module" src="./js/index.js"></script>


</body>
</html>
