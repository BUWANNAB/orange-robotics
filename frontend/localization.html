<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实时定位 · 地图热切换</title>
<link rel="stylesheet" href="src/modules/operations/operations.css">
<style>body{display:block}main{margin:0;max-width:1450px;margin-inline:auto}.local-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.map-pane{background:#fff;border:1px solid #dae3e9;border-radius:12px;padding:16px}canvas{width:100%;height:560px;background:#f1f5f8;touch-action:none}.local-form{display:grid;gap:14px}.local-form label{display:grid;gap:5px}.metrics{display:flex;gap:16px;flex-wrap:wrap;padding:16px 0}.state{padding:12px;background:#fff3ce;border-radius:8px}.state.good{background:#dcf5e8}#message{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.5}@media(max-width:850px){.local-grid{grid-template-columns:1fr}canvas{height:380px}}</style><style>html.embedded main{padding:18px}html.embedded main>header{display:none}html.embedded canvas{height:480px}</style><script>if(new URLSearchParams(location.search).has("embedded"))document.documentElement.classList.add("embedded");</script><style>.map-view-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}.map-view-title{display:grid;gap:3px}.map-view-title strong{color:#243b50;font-size:14px}.map-view-title span{color:#718294;font-size:12px}.map-view-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.map-view-controls button{padding:7px 10px;border-color:#dce5eb;background:#f9fbfc;color:#38536a}.map-view-controls button:hover{background:#edf4f7;border-color:#91aebf}.map-view-controls output{min-width:54px;text-align:center;border-radius:999px;background:#eef4f7;color:#526b7e;padding:5px 9px;font-size:12px;font-weight:600}.map-pane{border-radius:14px;box-shadow:0 8px 24px #26384a0a}canvas#pose-map{background:#f7f9fc;border:1px solid #e0e8ee;border-radius:10px;box-shadow:inset 0 0 0 1px #ffffff}#map-caption{margin:10px 2px 4px;color:#718294;font-size:12px;line-height:1.6}@media(max-width:850px){.map-view-toolbar{align-items:flex-start;flex-direction:column}}</style></head>
<body><main><header><div><small>LOCAL ROBOT / ROS 2</small><h1>实时定位与地图热切换</h1></div><a href="map-workbench.html#locate">地图工作台 ↗</a></header>
<div id="pose-status" class="state" role="status">等待定位数据</div>
<div class="metrics"><strong id="source">未连接</strong><span id="xy">X — / Y —</span><span id="heading">朝向 —</span><span id="quality">匹配分数 —</span><span id="age">数据年龄 —</span></div>
<div class="local-grid"><section class="map-pane"><div class="map-view-toolbar"><div class="map-view-title"><strong>地图方向</strong><span>只旋转屏幕显示，不修改地图坐标、PCD 或路线</span></div><div class="map-view-controls"><button type="button" id="rotate-view-left" title="逆时针旋转 90 度">↶ 左转 90°</button><output id="map-rotation" aria-live="polite">0°</output><button type="button" id="rotate-view-right" title="顺时针旋转 90 度">↷ 右转 90°</button><button type="button" id="reset-view-rotation">恢复默认</button></div></div><canvas id="pose-map" aria-label="地图、机器人位置和轨迹"></canvas><p id="map-caption">坐标网格（米）。选择地图可显示绑定的已发布底图与路径。</p><button id="pick-pose" aria-pressed="false" disabled>拖拽重定位</button> <button id="cancel-pick">取消选点</button><p id="pick-hint" role="status">点击“拖拽重定位”，在地图上按下选位置，拖动箭头选朝向。</p><button id="follow">跟随车辆</button> <button id="clear-trail">清空轨迹</button></section>
<aside class="map-pane"><form id="switch-form" class="local-form"><h2>地图热切换</h2><a href="map-bindings.html" target="_blank" rel="noopener">绑定点云与线路地图 ↗</a><label>定位地图（PCD）<select id="map-key" required><option value="">加载中…</option></select></label><label>初始 X（米）<input id="pose-x" type="number" step="any" required value="0"></label><label>初始 Y（米）<input id="pose-y" type="number" step="any" required value="0"></label><label>初始朝向（度）<input id="pose-yaw" type="number" step="any" min="-180" max="180" required value="0"></label><button type="button" id="use-pose">填入当前位姿</button><button class="primary" id="switch-button">停车并切换 / 重新定位</button><p>确认停车后加载地图，等待连续匹配收敛。切换完成仍保持软件停止锁定。</p></form>
<hr><div class="local-form"><button id="auto-pose" disabled>自动寻找位置</button><button id="auto-cancel" disabled>取消自动寻找</button><p id="auto-state" role="status">自动重定位需要真实雷达、停车反馈和自动定位节点。</p><button id="stop-button">停止导航并锁定</button><button id="release-button">解除软件停止锁定</button><p>软件停止不代替物理急停。</p><strong id="switch-state">切换状态：—</strong><p id="message" role="alert"></p></div></aside></div></main>
<script src="src/libs/axios.min.js"></script><script src="src/api/api-simple.js"></script><script src="src/api/operations.js"></script><script src="src/modules/maps/pgm.js?v=map-theme-2"></script><script src="src/modules/operations/pose-gesture.js?v=map-view-rotation-2"></script><script src="src/modules/operations/localization.js?v=map-view-rotation-2"></script></body></html>
